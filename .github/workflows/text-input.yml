name: text input

on:
  push:
    paths:
      - 'app/**'
      - 'internal/platform/**'
      - '.github/workflows/text-input.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'internal/platform/**'
      - '.github/workflows/text-input.yml'
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. main is never cancelled: every
# commit it gets has run this workflow to the end.
concurrency:
  group: text-input-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # macOS is not in the matrix: ci.yml's darwin job tests ./app and vets the
  # darwin platform packages on macOS for every change that reaches here, so a
  # third macOS job would only take a slot from the pool that all workflows
  # share. The type-checks are not repeated either: ci.yml's lint job vets every
  # package for Linux and its cross-vet job for Windows.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Application input lifecycle
        run: go test ./app -count=1
      - name: Windows IME lifecycle
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run 'TestComposition|TestDynamicTextInput' -count=1
      - name: Windows aligned text input
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run '^TestWindowsTextInputAlignmentMatchesGlyphCaretUnderlineAndPointer$' -count=1
      - name: Linux aligned text input
        if: runner.os == 'Linux'
        run: go test ./internal/platform/linux -run '^TestLinux(TextInputAlignmentMatchesGlyphCaretUnderlineAndPointer|RightToLeftAlignmentUsesLineWidthNotLogicalEndCaret|CandidateWindowFollowsAlignmentWhenNativeOverlaysAreHidden)$' -count=1
      # A terminal input is a preedit surface with a cursor of its own: the native
      # editor must draw no caret or selection over it, and blink none.
      - name: Windows terminal preedit draws no native caret
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run '^TestTerminalPreedit' -v -count=1
      - name: Windows console key records
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run 'TestTerminalControlKeysCarryConsoleCharacters|TestConsoleKeyCharacterTranslatesControlChords|TestAltGrLeavesPrintableCharactersToText|TestCharCompletesTheConsoleRecord' -count=1
      # A space arrives as both VK_SPACE and WM_CHAR " "; taking both typed it
      # twice in a terminal and sent a text field a key it had already typed.
      - name: Windows space is one character
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run 'TestAPlainSpaceIsOneCharacter|TestATerminalGetsEditingKeysAndChordsAsRawKeys' -v -count=1
      - name: Windows fixed-pitch text
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run '^TestFixedPitchTrailingSpacesDoNotStretchText$' -v -count=1
      - name: Windows window placement
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run 'TestPlacedFrame' -v -count=1
      - name: Windows status item notifications
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run 'TestStatusNotificationRoutesActivationAndContextMenu|TestStatusMessagesOfOneClickCountOnce' -v -count=1
