name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same gate before it publishes a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate on the platform the macOS backend needs.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: vet (headless)
        run: go vet -tags vivahead ./internal/platform/darwin ./headless/...
      - name: test
        run: go test ./... -count=1

  # The Windows, Linux and web backends are not run here; they must at least
  # type-check, tests included, for every target they ship for.
  cross-vet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet ${{ matrix.target }}
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go vet ./internal/... ./app/ ./cmd/... ./components/...
        env:
          TARGET: ${{ matrix.target }}

  windows-materials:
    runs-on: windows-latest
    env:
      VIVA_SOFTWARE_RENDERING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Material contracts and controls (WARP)
        run: go test ./internal/platform/windows ./ui ./components ./headless -run 'Test(Backdrop|WindowBackdrop|CompositionClear|CompositionFallback|CompositionCreation|CustomBackdrop|AcrylicAccent|LegacyAcrylic|RoundedOutline|Translucent)' -count=1 -v

  cross-vet-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet js/wasm
        run: GOOS=js GOARCH=wasm go vet ./internal/platform/web/ ./app/

  # Packaging, manifest and layout code is plain Go with no window: it runs
  # on Linux, where the .deb and .tar.gz it writes are consumed.
  linux-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: test
        run: go test ./cmd/... ./tools/... ./text/... ./flex/... ./markdown/... ./ui/... -count=1

  # A noise-tolerant benchmark regression gate for the pure-Go paths: the base
  # revision and the pull request run the same benchmarks on the same runner,
  # and a slowdown above benchmarks/history.sh's threshold (15% and at least
  # 20 ns) or any new allocation fails. Platform, GPU and window benchmarks are
  # deliberately out: they are not reproducible on a shared runner.
  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: checkout the base revision
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git worktree add --detach ../base FETCH_HEAD
      - name: benchmark base
        run: VIVA_ROOT=../base ./benchmarks/ci.sh /tmp/base.txt
      - name: benchmark candidate
        run: ./benchmarks/ci.sh /tmp/head.txt
      - name: compare
        run: go run ./tools/perfhistory compare -threshold 0.20 -min-ns 100 /tmp/base.txt < /tmp/head.txt
