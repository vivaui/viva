name: Windows payload helper diagnostic

on:
  push:
    branches: [codex/windows-payload-helper-diagnostic]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Inspect native and relocated system executable exits
        run: go test ./update -run '^TestCopiedSystemExecutableExitStatus$' -count=1 -timeout=2m -v
      - name: Trace the unchanged payload helper
        env:
          VIVA_PAYLOAD_DIAGNOSTIC: '1'
        run: go test ./update -run '^TestPayloadHelper(ReplacesTheApplication|RollsBackAFailedStart)$' -count=1 -timeout=2m -v
